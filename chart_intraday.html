function dailyMarks(){

function allBarsOfTf(){

function profile(bars,bk){
  const acc={};
  for(const b of bars){
    const b0=Math.floor(b.l/bk), b1=Math.max(b0,Math.floor(b.h/bk));
    const share=VOL(b)/(b1-b0+1);
    for(let k=b0;k<=b1;k++){ acc[k]=(acc[k]||0)+share; }
  }
  return acc;
}
// 表示レンジ内の全ビン(出来高0の帯も含む)+POC+バリューエリア70%
function profileStats(acc,bk,lo,hi){
  const k0=Math.floor(lo/bk), k1=Math.floor(hi/bk);
  const bins=[]; let tot=0, vmax=0, poc=k0;
  for(let k=k0;k<=k1;k++){
    const v=acc[k]||0; bins.push({k,v}); tot+=v;
    if(v>vmax){ vmax=v; poc=k; }
  }
  // POCから厚い側へ広げて出来高70%を包む(標準的なバリューエリアの取り方)
  let up=poc, dn=poc, sum=acc[poc]||0; const target=tot*0.7;
  while(sum<target && (dn>k0 || up<k1)){
    const a=(up<k1)?(acc[up+1]||0):-1;
    const b=(dn>k0)?(acc[dn-1]||0):-1;
    if(a<0 && b<0) break;
    if(a>=b){ up++; sum+=a; } else { dn--; sum+=b; }
  }
  // 真空帯: POC比25%未満のビンの連続run(=薄くて滑る価格帯)。
  // 走査は実際に値が付いた範囲だけ(上下の描画余白を真空と誤検出しないため)
  let kMin=k1, kMax=k0;
  for(let k=k0;k<=k1;k++){ if((acc[k]||0)>0){ if(k<kMin)kMin=k; if(k>kMax)kMax=k; } }
  const thr=vmax*0.25, runs=[]; let st=null;
  for(let k=kMin;k<=kMax;k++){
    const thin=(acc[k]||0)<thr;
    if(thin && st===null) st=k;
    if((!thin || k===kMax) && st!==null){ const en=thin?k:k-1; if(en>=st) runs.push([st,en]); st=null; }
  }
  return {bins,tot,vmax,poc,vah:up,val:dn,runs};
}
function niceStep(raw){
  const c=[5,10,25,50,100,250,500,1000,2500,5000,10000];
  for(const s of c){ if(raw<=s) return s; }
  return 20000;
}
function draw(){
  const {bars,marks,single,date}=viewBars();
  if(!bars.length) return;
  const cv=$('cv'), ctx=cv.getContext('2d');
  const padL=64, padR=150, padT=18, volH=90, padB=volH+34;
  // 1画面フィット幅。全期間は「5分の1日表示と同じローソク幅」で横に伸ばす(スクロール)
  const fitW=Math.max(900, ($('wrap').clientWidth||1160)-2);
  let W;
  if(single){ W=Math.ceil(padL+padR+(fitW-padL-padR)*zoom); }
  else {
    let ref=230;
    for(const d of D.tf5.slice(-3)){ if(d.bars.length>ref) ref=d.bars.length; }
    const px=(fitW-padL-padR)/ref*zoom;

  }
  // 高DPI: 論理サイズはCSSに、実ピクセルはDPR倍で持つ(細線と文字のにじみ防止)
  const DPR=Math.min(2,window.devicePixelRatio||1), H=CH;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  const ovc=$('cx');
  ovc.style.width=W+'px'; ovc.style.height=H+'px';
  ovc.width=cv.width; ovc.height=cv.height;
  ctx.setTransform(DPR,0,0,DPR,0,0);

    ctx.fillStyle='#8b949e'; ctx.textAlign='right'; ctx.fillText(p.toLocaleString(), padL-5, y(p)+3);

      const vaTop=y((ps.vah+1)*bucket), vaBot=y(ps.val*bucket);
      ctx.fillStyle='rgba(88,166,255,0.07)';
      ctx.fillRect(padL,vaTop,chW,Math.max(1,vaBot-vaTop));
      ctx.strokeStyle='rgba(88,166,255,0.55)'; ctx.setLineDash([3,3]);
      for(const yy of [vaTop,vaBot]){ ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(W-padR,yy); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.font='10px sans-serif'; ctx.textAlign='left'; ctx.fillStyle='#58a6ff';

  }

  if(showBand && (tf==='D' || (tf==='60M'&&range==='all'))){

      for(let i=0;i<n;i++){ s+=cls[i]; if(i>=P) s-=cls[i-P]; if(i>=P-1) ma[i]=s/P; }
      const dev=new Array(n).fill(null);
      for(let i=P-1;i<n;i++) dev[i]=cls[i]/ma[i]-1;
      const q=(arr,p)=>{ const a=[...arr].sort((u,v2)=>u-v2); const r=(a.length-1)*p, f=Math.floor(r); return a[f]+(a[f+1]!==undefined?(a[f+1]-a[f])*(r-f):0); };
      const ln={c:[],u1:[],l1:[],u2:[],l2:[]};
      for(let i=0;i<n;i++){
        if(ma[i]===null){ for(const k of Object.keys(ln)) ln[k].push(null); continue; }
        const w0=Math.max(P-1,i-L+1), win=[];
        for(let j=w0;j<=i;j++) if(dev[j]!==null) win.push(dev[j]);
        if(win.length<MINW){ for(const k of Object.keys(ln)) ln[k].push(null); continue; }
        ln.c.push(ma[i]);
        ln.u1.push(ma[i]*(1+q(win,0.9)));  ln.l1.push(ma[i]*(1+q(win,0.1)));
        ln.u2.push(ma[i]*(1+q(win,0.98))); ln.l2.push(ma[i]*(1+q(win,0.02)));
      }
      ctx.save(); ctx.beginPath(); ctx.rect(padL,padT,chW,chH); ctx.clip();
      const plot=(arr,col,dash,lw)=>{ ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.setLineDash(dash); ctx.beginPath(); let pen=false;
        for(let i=0;i<n;i++){ const p=arr[i]; if(p===null){ pen=false; continue; } const xx=x(i)+bw/2, yy=y(p); if(pen) ctx.lineTo(xx,yy); else ctx.moveTo(xx,yy); pen=true; }
        ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1; };
      plot(ln.c,'#a371f7',[],1.4);
      plot(ln.u1,'#39c5cf',[],1); plot(ln.l1,'#39c5cf',[],1);
      plot(ln.u2,'#d29922',[5,4],1); plot(ln.l2,'#d29922',[5,4],1);
      ctx.restore();
      let li=-1; for(let i=n-1;i>=0;i--){ if(ln.c[i]!==null){ li=i; break; } }
      if(li>=0){
        const items=[['最大上',ln.u2[li],'#d29922'],['通常上',ln.u1[li],'#39c5cf'],['中心',ln.c[li],'#a371f7'],['通常下',ln.l1[li],'#39c5cf'],['最大下',ln.l2[li],'#d29922']];
        ctx.font='10px sans-serif'; ctx.textAlign='right';
        for(const it of items){
          const p=it[1]; if(p<lo||p>hi) continue;
          ctx.strokeStyle=it[2]; ctx.setLineDash([2,3]); ctx.beginPath();
          ctx.moveTo(x(li)+bw,y(p)); ctx.lineTo(W-padR,y(p)); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle=it[2]; ctx.fillText(it[0]+' '+Math.round(p).toLocaleString(), W-padR-4, y(p)-2);
        }
        ctx.textAlign='left';
      }
    }
  }

  if(tf==='5M'){
    if(single){
      // 前営業日の日中終値 → 左端から右端まで
      const ds=D.tf5; let prevClose=null;
      for(let j=curDay-1;j>=0;j--){ const bb=ds[j].bars.filter(b=>b.s==='d'); if(bb.length){ prevClose=bb[bb.length-1].c; break; } }
      if(prevClose!==null && prevClose>=lo && prevClose<=hi){

        ctx.fillStyle='#d29922'; ctx.textAlign='left'; ctx.font='10px sans-serif';

      }

        if(nc>=lo && nc<=hi){

          ctx.moveTo(x(ni)+bw,y(nc)); ctx.lineTo(W-padR,y(nc)); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle='#58a6ff'; ctx.font='10px sans-serif';

  }

    }

  // 下段: 出来高

  if(single){

    ? date+'（夜間→日中）  始 '+first.o.toLocaleString()+' → 終 '+last.c.toLocaleString()+' ('+(last.c>=first.o?'+':'')+(last.c-first.o).toLocaleString()+'円)'
    : (tf==='D'?'日足 全期間':'全期間つなげ表示')+'  '+first.o.toLocaleString()+' → '+last.c.toLocaleString();
  ctx.fillText(ttl, padL+4, 12);
  LAY={padL,padR,padT,chW,chH,W,H,n,bw,lo,hi,bars,single};
  hideHud();
}

const F=v=>Math.round(v).toLocaleString();
function showAt(clientX,clientY){

  const p=hi-(my-padT)/chH*(hi-lo);

  c2.fillStyle='#e6edf3'; c2.font='10px sans-serif'; c2.textAlign='right';
  c2.fillText(F(p),padL-7,my+4);
  const dif=b.c-b.o, k=dif>=0?'u':'d';
  hud.style.left=(wrap.scrollLeft+padL+8)+'px';
  hud.style.display='block';
  hud.innerHTML='<span class="k">'+(b.t||'')+'</span>'+(b.s==='n'?'<span class="k">夜間</span>':'')
    +'<span class="big '+k+'">'+F(b.c)+'</span> <span class="'+k+'">'+(dif>=0?'+':'')+F(dif)+'</span><br>'
    +'<span class="k">始</span>'+F(b.o)+' <span class="k">高</span>'+F(b.h)+' <span class="k">安</span>'+F(b.l)+'<br>'
    +'<span class="k">出来高</span>'+F(VOL(b));
}
wrap.addEventListener('mousemove',e=>showAt(e.clientX,e.clientY));
wrap.addEventListener('mouseleave',hideHud);
wrap.addEventListener('touchstart',e=>{ const t=e.touches[0]; if(t) showAt(t.clientX,t.clientY); },{passive:true});
wrap.addEventListener('touchmove',e=>{ const t=e.touches[0]; if(t) showAt(t.clientX,t.clientY); },{passive:true});
wrap.addEventListener('mousedown',e=>{ drag={x:e.clientX,sl:wrap.scrollLeft}; wrap.classList.add('grab'); hideHud(); });
window.addEventListener('mousemove',e=>{ if(drag) wrap.scrollLeft=drag.sl-(e.clientX-drag.x); });
window.addEventListener('mouseup',()=>{ if(drag){ drag=null; wrap.classList.remove('grab'); } });
syncMk(); buildDayTabs(); draw();
// 全期間表示は右端(最新)から見る
if(range==='all') wrap.scrollLeft=wrap.scrollWidth;
window.addEventListener('resize',()=>{ CH=expanded?expHeight():640; draw(); });
</script></body></html>
